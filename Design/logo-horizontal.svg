<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <filter id="banner-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D0D5E0" />
    </linearGradient>
    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#E52E71" />
    </linearGradient>
  </defs>

  <!-- Embed standalone icon scaled down -->
  <g transform="translate(30, 20) scale(0.55)">

  <defs>
    <!-- Background outer glow -->
    <filter id="outer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Bezel Gradient -->
    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#434853" />
      <stop offset="40%" stop-color="#2B2F38" />
      <stop offset="100%" stop-color="#15171C" />
    </linearGradient>

    <!-- Inner Bezel Stroke -->
    <linearGradient id="inner-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Aurora Fluid Mesh Gradients -->
    <radialGradient id="aurora-core" cx="35%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#4FACFE" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#7F00FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#110E28" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="aurora-warm" cx="80%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#E52E71" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#7928CA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurora-cyan" cx="20%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Play Button Fill -->
    <linearGradient id="glass-fill" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glass Stroke -->
    <linearGradient id="glass-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glass Play Symbol Fill -->
    <linearGradient id="play-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7" />
    </linearGradient>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Shadow below squircle -->
  <rect x="56" y="68" width="400" height="400" rx="92" ry="92" fill="#000000" opacity="0.35" filter="url(#drop-shadow)" />

  <!-- Outer Titanium Bezel -->
  <rect x="56" y="56" width="400" height="400" rx="92" ry="92" fill="url(#bezel)" stroke="#101216" stroke-width="2" />

  <!-- Inner Display Container -->
  <rect x="66" y="66" width="380" height="380" rx="82" ry="82" fill="#0B0D13" stroke="url(#inner-stroke)" stroke-width="1.5" />

  <!-- Aurora Fluid Waves Background -->
  <g clip-path="url(#screen-clip)">
    <clipPath id="screen-clip">
      <rect x="66" y="66" width="380" height="380" rx="82" ry="82" />
    </clipPath>

    <!-- Deep Base Background -->
    <rect x="66" y="66" width="380" height="380" fill="#090B10" />

    <!-- Aurora layers -->
    <circle cx="190" cy="220" r="260" fill="url(#aurora-core)" style="mix-blend-mode: screen;" />
    <circle cx="360" cy="180" r="200" fill="url(#aurora-warm)" style="mix-blend-mode: screen;" />
    <circle cx="160" cy="340" r="190" fill="url(#aurora-cyan)" style="mix-blend-mode: screen;" />

    <!-- Dynamic Flow Waves -->
    <path d="M 66,320 C 140,240 220,380 340,260 C 400,200 420,240 446,230 L 446,446 L 66,446 Z" fill="url(#aurora-warm)" opacity="0.55" style="mix-blend-mode: screen;" />
    <path d="M 66,220 C 160,180 200,310 320,220 C 380,180 410,210 446,190 L 446,446 L 66,446 Z" fill="url(#aurora-cyan)" opacity="0.4" style="mix-blend-mode: screen;" />

    <!-- Diagonal Glass Sheen Reflection -->
    <path d="M 66,66 L 360,66 L 160,446 L 66,446 Z" fill="#FFFFFF" opacity="0.035" />

    <!-- Glass Center Disc -->
    <circle cx="256" cy="256" r="82" fill="url(#glass-fill)" stroke="url(#glass-stroke)" stroke-width="2" />
    <circle cx="256" cy="256" r="74" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />

    <!-- Play Icon Triangle -->
    <path d="M 238,214 C 238,209 244,206 248,208 L 298,248 C 302,251 302,257 298,260 L 248,300 C 244,302 238,299 238,294 Z" fill="url(#play-fill)" filter="url(#drop-shadow)" />
  </g>

  </g>

  <!-- Brand Typography -->
  <text x="340" y="160" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="88" font-weight="700" fill="url(#text-grad)" letter-spacing="-1.5">Wallpaper</text>
  <text x="344" y="208" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="24" font-weight="500" fill="url(#sub-grad)" letter-spacing="0.5">DYNAMIC VIDEO ENGINE FOR MACOS</text>
  <text x="344" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="16" font-weight="400" fill="#8E95A5">Native AppKit &amp; AVFoundation • Hardware Accelerated • Multi-Display</text>
</svg>